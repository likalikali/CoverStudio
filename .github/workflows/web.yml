name: web

on:
  push:
    branches: [main]
    paths:
      - "tsumugi-piano-cover/web/**"
      - "tsumugi-piano-cover/cover_studio/web.py"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "tsumugi-piano-cover/web/**"
      - "tsumugi-piano-cover/cover_studio/web.py"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tsumugi-piano-cover/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tsumugi-piano-cover/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Package built UI
        working-directory: tsumugi-piano-cover/cover_studio/static
        run: |
          echo "$GITHUB_SHA" > BUILD_COMMIT
          zip -r "$RUNNER_TEMP/web-dist.zip" .
      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverstudio-web-dist
          path: tsumugi-piano-cover/cover_studio/static/
          if-no-files-found: error
      - name: Publish web-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="CoverStudio main UI build (${GITHUB_SHA::7})."
          if gh release view web-latest > /dev/null 2>&1; then
            gh release edit web-latest --notes "$notes"
          else
            gh release create web-latest --prerelease --title "CoverStudio UI" --notes "$notes"
          fi
          gh release upload web-latest "$RUNNER_TEMP/web-dist.zip" --clobber
